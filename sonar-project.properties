# SonarQube 코드 검사 설정 (.github/workflows/sonar.yml이 읽는다)
# 서버 주소와 토큰은 GitHub 시크릿(SONAR_HOST_URL, SONAR_TOKEN)에만 둔다
sonar.projectKey=log
sonar.projectName=blog
sonar.sourceEncoding=UTF-8

# 서버(Java)와 화면(TypeScript)을 함께 검사한다
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.test.inclusions=backend/src/test/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx

sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test
# 커버리지는 서버(Java) 테스트로만 계산한다. 화면 코드도 버그·냄새 검사는 그대로 받는다
sonar.coverage.exclusions=frontend/**
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
