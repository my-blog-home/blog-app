<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 링크 미리보기(카카오톡·페이스북 등). 서버(PageController)가 주소마다 이 사이를 글 제목·요약·첫 이미지로 바꿔 내려 준다 -->
    <!--meta:start-->
    <meta name="description" content="Ylog는 누구나 블로그를 만들어 글을 쓰고 나누는 블로그 서비스입니다." />
    <meta property="og:site_name" content="Ylog" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ylog" />
    <meta property="og:description" content="Ylog는 누구나 블로그를 만들어 글을 쓰고 나누는 블로그 서비스입니다." />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Ylog</title>
    <!--meta:end-->
    <!-- 첫 그림 전에 화면 모드를 정해 하얗게 번쩍이지 않게 한다. 고른 적이 없으면 기기 설정을 따른다 -->
    <script>
      (function () {
        var t
        try { t = localStorage.getItem('ylog.theme') } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
