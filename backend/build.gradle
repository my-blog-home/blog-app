plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.myblog'
// 서비스 버전. 올릴 때는 release-notes에 같은 버전의 노트를 함께 더한다 (RELEASING.md)
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.session:spring-session-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 배포용 jar 안에 화면 빌드 결과(frontend/dist)를 넣는다. 화면을 먼저 빌드해 두어야 한다 (build.sh가 순서대로 한다)
tasks.named('processResources') {
    from('../frontend/dist') {
        into 'static'
    }
}

// 서버가 자기 버전을 알 수 있게 build-info를 만든다 (화면 바닥글의 버전 표시)
springBoot {
    buildInfo()
}

// 버전이 바뀌어도 배포 스크립트가 같은 이름으로 찾도록 jar 이름을 고정한다
tasks.named('bootJar') {
    archiveFileName = 'myblog.jar'
}
