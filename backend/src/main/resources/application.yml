spring:
  application:
    name: myblog
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
    timeout: 7d
  jackson:
    time-zone: UTC

server:
  servlet:
    session:
      cookie:
        name: SESSION
        http-only: true
        same-site: lax
        max-age: 7d
        secure: false

# 원천 문서 각 파일의 '기본값' 표와 같은 값. 바꿀 때는 여기만 고친다 (NF-08).
blog:
  zone: Asia/Seoul
  limits:
    nickname-min: 2
    nickname-max: 10
    password-min: 8
    # 화면에는 "8자 이상"만 안내한다. 상한은 BCrypt가 72바이트까지만 쓰기 때문에 두는 기술적 한도다
    password-max: 64
    verification-code-ttl: 10m
    verification-resend-interval: 1m
    verification-daily-max: 5
    verification-max-failures: 5
    verified-ttl: 30m
    login-max-failures: 5
    login-lock-duration: 10m
    blog-name-max: 30
    blog-description-max: 200
    category-name-max: 20
    category-description-max: 100
    post-title-max: 100
    post-body-max: 10000
    page-size: 10
    excerpt-length: 100
    search-min: 2
    search-max: 50
    comment-max: 500
    comment-interval: 5s
    tags-per-post: 5
    tag-max: 15
    report-detail-max: 200
    image-max-bytes: 5242880
    images-per-post: 10
    drawer-subscription-max: 8
    hot-post-days: 14
    hot-post-count: 3
    hot-blogger-days: 7
    hot-blogger-count: 5
    hot-comment-weight: 5
    popular-keyword-count: 10
    popular-keyword-window: 24h
    popular-keyword-compare: 1h
    search-log-keyword-max: 30
    search-log-retention: 2d
    notice-related-count: 5
    rejoin-wait-days: 30
    suspension-days: 3,7,30
    suspension-reason-max: 200
    handle-note-max: 200
    notice-title-max: 100
    notice-content-max: 5000
    admin-summary-pending-count: 5
  # 관리자 계정 (FR-078, BR-47). 둘 다 값이 있고 그 이메일의 회원이 없을 때만 서버를 켤 때 관리자를 하나 만든다.
  # 배포는 환경변수 ADMIN_EMAIL·ADMIN_PASSWORD로 넣는다(비밀번호는 저장소에 두지 않는다)
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: no-reply@myblog.local
  image:
    # 이미지 파일을 두는 서버 폴더 (research R-08, MinIO로 바꿀 수 있게 ImageStorage 뒤에 둠)
    dir: ${user.home}/.myblog/images
