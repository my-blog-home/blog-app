spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/myblog
    username: ${DB_USERNAME:myblog}
    password: ${DB_PASSWORD:myblog}
  data:
    redis:
      host: localhost
      port: 6379

# 개발 중에는 메일 대신 서버 로그에 인증번호를 찍는다 (research R-06)
blog:
  mail:
    mode: log
    # 개발 중에는 인증번호를 가입 화면에도 보여 준다
    show-code-on-screen: true
  # 개발용 관리자 계정 (FR-078). 서버를 켤 때 이 이메일의 회원이 없으면 관리자로 만든다
  admin:
    # 비밀번호는 저장소에 두지 않는다. ADMIN_PASSWORD를 설정해야 관리자 계정이 만들어진다
    email: ${ADMIN_EMAIL:admin@ylog.local}
    password: ${ADMIN_PASSWORD:}

# 화면 빌드 결과(frontend/dist)를 서버가 함께 내려 준다. 주소 하나(http://localhost:8080)로 쓸 수 있다
spring.web.resources.static-locations: file:${BLOG_WEB_DIR:${user.home}/Documents/blog-app/frontend/dist}/
