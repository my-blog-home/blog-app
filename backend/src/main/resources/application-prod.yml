# 배포 환경. 모든 접속 정보와 비밀 값은 환경변수로 받는다 (DEPLOY.md 참고)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${PORT:8080}
  # Nginx·로드밸런서 뒤에서 HTTPS 여부와 원래 주소를 알 수 있게 한다
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # HTTPS로 서비스하면 true(기본). HTTP로 잠깐 시험할 때만 COOKIE_SECURE=false
        secure: ${COOKIE_SECURE:true}

logging:
  level:
    root: INFO

blog:
  mail:
    # smtp: 실제 메일 발송. log: 인증번호를 서버 로그에 찍음(메일 계정을 정하기 전 임시로만)
    mode: ${MAIL_MODE:smtp}
    from: ${SMTP_FROM:no-reply@ylog.local}
    # 시험 운영 때만 true. 켜면 인증번호가 화면에 보여서 남의 이메일로도 가입할 수 있다
    show-code-on-screen: ${SHOW_CODE_ON_SCREEN:false}
  image:
    dir: ${IMAGE_DIR:/var/lib/ylog/images}
