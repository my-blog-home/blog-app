# 테스트는 로컬 PostgreSQL의 myblog_test DB와 Redis 15번 DB를 쓴다
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/myblog_test
    username: ${DB_USERNAME:myblog}
    password: ${DB_PASSWORD:myblog}
  data:
    redis:
      host: localhost
      port: 6379
      database: 15
blog:
  # 테스트에서는 릴리스 노트를 공지에 자동으로 올리지 않는다 (ReleaseNoteIT가 직접 부른다)
  release-notes:
    publish: false
  mail:
    mode: log
  image:
    dir: ${java.io.tmpdir}/myblog-test-images
  cache:
    # 테스트는 기록하자마자 순위가 바뀌는지 보므로 캐시를 끈다 (PopularKeywordCacheIT가 따로 확인)
    popular-keywords-ttl: 0s
