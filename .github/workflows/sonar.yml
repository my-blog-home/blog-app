# SonarQube 코드 검사. develop·main으로 가는 PR과 develop에 올라온 커밋마다 돈다
# 결과만 SonarQube에 올리고 PR을 막지 않는다. 배포(deploy.yml)와는 따로 돈다
# 시크릿 SONAR_HOST_URL, SONAR_TOKEN이 없으면(복사한 저장소 등) 검사 단계를 건너뛴다
name: SonarQube

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  sonar:
    if: github.repository == 'my-blog-home/blog-app'
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myblog_test
          POSTGRES_USER: myblog
          POSTGRES_PASSWORD: myblog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myblog" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 줄마다 누가 언제 바꿨는지(새 코드 판단)에 필요
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: 서버 테스트와 커버리지
        if: env.SONAR_TOKEN != ''
        working-directory: backend
        run: ./gradlew test jacocoTestReport --no-daemon
      - name: SonarQube 검사
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v4
