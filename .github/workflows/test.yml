# 서버 통합 테스트와 화면 테스트. CI와 배포가 함께 쓴다
name: Test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: myblog_test
          POSTGRES_USER: myblog
          POSTGRES_PASSWORD: myblog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myblog" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 화면 빌드·테스트
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc -b
          npm run build
          npm test
      - name: 서버 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon
