# Git Flow: develop·main으로 가는 PR과 develop에 올라온 커밋마다 테스트와 도커 이미지 빌드만 확인한다 (배포하지 않음)
# 배포는 main에 병합될 때만 한다 (deploy.yml)
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 도커 이미지 빌드 확인
        run: docker build -t ylog:ci .
