# main에 push되거나 PR이 병합되면: 테스트 → 도커 이미지 빌드 → 서버로 보내고 SSH로 실행
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 도커 이미지 빌드
        run: |
          docker build -t ylog:latest .
          docker save ylog:latest | gzip > ylog-image.tar.gz
          mkdir -p upload && mv ylog-image.tar.gz upload/ && cp deploy/deploy.sh upload/

      - name: 서버로 이미지와 실행 스크립트 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "upload/ylog-image.tar.gz,upload/deploy.sh"
          target: "ylog"
          strip_components: 1

      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          # 아래는 선택 시크릿. 등록하지 않으면 deploy.sh의 기본값을 쓴다
          MAIL_MODE: ${{ secrets.MAIL_MODE }}
          SHOW_CODE_ON_SCREEN: ${{ secrets.SHOW_CODE_ON_SCREEN }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 10m
          envs: DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,SUDO_PASSWORD,MAIL_MODE,SHOW_CODE_ON_SCREEN,COOKIE_SECURE,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM
          # 비어 있는 선택 값은 deploy.sh가 기본값으로 바꾼다
          script: bash "$HOME/ylog/deploy.sh"
