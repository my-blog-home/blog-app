# main에 push되거나 PR이 병합되면: 테스트 → 도커 이미지 빌드 → 서버로 보내고 SSH로 실행
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # 실제 서버 배포와 릴리스는 원래 저장소에서만 한다. 코드를 복사해 둔 다른 저장소(과제 제출용 등)에는
  # 서버 접속 시크릿이 없으므로 테스트만 돌고 배포·릴리스는 건너뛴다
  deploy:
    if: github.repository == 'my-blog-home/blog-app'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 도커 이미지 빌드
        run: |
          docker build -t ylog:latest .
          docker save ylog:latest | gzip > ylog-image.tar.gz
          # 무중단 배포의 앞단 Nginx 이미지도 함께 보낸다(서버가 인터넷에서 받지 않아도 되게)
          docker pull nginx:1.27-alpine
          docker save nginx:1.27-alpine | gzip > proxy-image.tar.gz
          mkdir -p upload && mv ylog-image.tar.gz proxy-image.tar.gz upload/ && cp deploy/deploy.sh upload/

      - name: 서버로 이미지와 실행 스크립트 보내기
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "upload/ylog-image.tar.gz,upload/proxy-image.tar.gz,upload/deploy.sh"
          target: "ylog"
          strip_components: 1

      - name: 서버에서 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SUDO_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          # 아래는 선택 시크릿. 등록하지 않으면 deploy.sh의 기본값을 쓴다
          MAIL_MODE: ${{ secrets.MAIL_MODE }}
          SHOW_CODE_ON_SCREEN: ${{ secrets.SHOW_CODE_ON_SCREEN }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # 관리자 계정 (선택). 둘 다 등록하면 처음 켤 때 그 이메일로 관리자를 만든다
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          # 소셜 로그인 (선택). 값이 있는 제공자만 켜진다
          GITHUB_CLIENT_ID: ${{ secrets.SOCIAL_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.SOCIAL_GITHUB_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.SOCIAL_KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.SOCIAL_KAKAO_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 10m
          envs: DB_ADDRESS,DB_PORT,DB_NAME,DB_SCHEMA,DB_DATABASE,DB_USERNAME,DB_PASSWORD,SUDO_PASSWORD,MAIL_MODE,SHOW_CODE_ON_SCREEN,COOKIE_SECURE,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM,ADMIN_EMAIL,ADMIN_PASSWORD,GITHUB_CLIENT_ID,GITHUB_CLIENT_SECRET,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET
          # 비어 있는 선택 값은 deploy.sh가 기본값으로 바꾼다
          script: bash "$HOME/ylog/deploy.sh"

  # 배포가 끝나면 이번 버전의 GitHub 릴리스(태그 v버전)를 만든다. 같은 버전을 다시 배포하면 건너뛴다
  release:
    if: github.repository == 'my-blog-home/blog-app'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -E "^version = " backend/build.gradle | sed -E "s/version = '(.*)'/\1/")
          NOTE="backend/src/main/resources/release-notes/$VERSION.md"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION 릴리스가 이미 있어 건너뜁니다"
            exit 0
          fi
          TITLE=$(grep -m1 '^title:' "$NOTE" | sed 's/^title:[[:space:]]*//')
          sed '1,/^---$/d' "$NOTE" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION · ${TITLE:-Ylog $VERSION}" --notes-file notes.md
